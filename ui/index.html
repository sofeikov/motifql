<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MotifQL — follow the money</title>
<style>
  :root {
    --bg: #0b0e13;
    --panel: #11161e;
    --panel-2: #151c26;
    --line: #232c3a;
    --text: #e9eef5;
    --dim: #9fadbf;
    --faint: #667080;
    --green: #3ddc84;
    --green-dim: #1d5c3c;
    --amber: #f0b429;
    --red: #f2707a;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.45;
  }
  header {
    display: flex;
    align-items: baseline;
    gap: 14px;
    padding: 14px 22px 12px;
    border-bottom: 1px solid var(--line);
  }
  header h1 {
    margin: 0;
    font-size: 21px;
    font-weight: 700;
    letter-spacing: 0.2px;
  }
  header h1 .q { color: var(--green); }
  header p {
    margin: 0;
    color: var(--dim);
    font-size: 13px;
  }
  header .spacer { flex: 1; }
  .badge {
    font-family: var(--mono);
    font-size: 11.5px;
    padding: 3px 10px;
    border: 1px solid var(--line);
    border-radius: 20px;
    color: var(--dim);
    white-space: nowrap;
  }
  .badge.live { color: var(--green); border-color: var(--green-dim); }
  .badge.cached { color: var(--amber); border-color: #5c4a1d; }
  main {
    display: grid;
    grid-template-columns: 392px minmax(0, 1fr);
    gap: 0;
    height: calc(100% - 56px);
    min-height: 0;
  }
  #side {
    border-right: 1px solid var(--line);
    padding: 16px 18px 20px;
    overflow-y: auto;
    background: var(--panel);
  }
  #side section { margin-bottom: 18px; }
  #side h2 {
    margin: 0 0 8px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--faint);
  }
  textarea {
    width: 100%;
    min-height: 122px;
    resize: vertical;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--text);
    font-family: var(--sans);
    font-size: 13px;
    line-height: 1.5;
    padding: 10px 12px;
  }
  textarea:focus { outline: none; border-color: var(--green-dim); }
  .row { display: flex; gap: 8px; margin-top: 10px; }
  button {
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 600;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--panel-2);
    color: var(--text);
    padding: 8px 14px;
    cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--green-dim); }
  button:disabled { opacity: 0.45; cursor: default; }
  button.primary {
    background: var(--green);
    border-color: var(--green);
    color: #062316;
  }
  button.primary:hover:not(:disabled) { background: #55e795; }
  pre.motif {
    margin: 0;
    background: #0d1219;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px 14px;
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 260px;
    overflow-y: auto;
  }
  .empty-note {
    color: var(--faint);
    font-size: 13px;
    border: 1px dashed var(--line);
    border-radius: 8px;
    padding: 14px;
    text-align: center;
  }
  .error-box {
    color: #ffd9dc;
    background: #2a1215;
    border: 1px solid #5c2228;
    border-radius: 8px;
    padding: 10px 12px;
    font-family: var(--mono);
    font-size: 12px;
    white-space: pre-wrap;
  }
  #stage-wrap {
    position: relative;
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    background:
      radial-gradient(circle at 50% 42%, #101823 0%, var(--bg) 72%);
  }
  #score-line {
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 14px 24px 0;
  }
  #score-line[hidden] { display: none; }
  #score-line .score {
    font-family: var(--mono);
    font-size: 30px;
    font-weight: 700;
    color: var(--green);
  }
  #score-line .verdict {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 3px 10px;
    border-radius: 4px;
  }
  #score-line .verdict.fires { background: var(--green); color: #062316; }
  #score-line .verdict.quiet { background: #232c3a; color: var(--dim); }
  #score-line .meta { color: var(--dim); font-size: 12.5px; font-family: var(--mono); }
  #caption {
    padding: 6px 24px 0;
    min-height: 26px;
    font-size: 14px;
    color: var(--text);
  }
  #caption .hop-no { color: var(--amber); font-weight: 700; font-family: var(--mono); }
  #caption .amt { color: var(--green); font-weight: 700; font-family: var(--mono); }
  #caption .dim { color: var(--dim); }
  #stage { flex: 1; min-height: 0; }
  #stage svg { width: 100%; height: 100%; display: block; }
  #transport {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 24px 16px;
  }
  #transport button {
    width: 34px;
    height: 34px;
    padding: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
  }
  #transport button svg { width: 15px; height: 15px; fill: currentColor; }
  #progress {
    flex: 1;
    height: 26px;
    display: flex;
    align-items: center;
    cursor: pointer;
  }
  #progress .track {
    position: relative;
    width: 100%;
    height: 5px;
    border-radius: 3px;
    background: #232c3a;
  }
  #progress .fill {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 0%;
    border-radius: 3px;
    background: var(--green);
  }
  #progress .tick {
    position: absolute;
    top: -3px;
    width: 2px;
    height: 11px;
    background: #3a4658;
  }
  #clock { font-family: var(--mono); font-size: 12px; color: var(--dim); min-width: 86px; text-align: right; }
  .tabs { display: flex; gap: 6px; }
  .tabs button {
    font-family: var(--mono);
    font-size: 12px;
    padding: 6px 12px;
  }
  .tabs button[aria-selected="true"] {
    border-color: var(--green-dim);
    color: var(--green);
  }
  .deg-row { margin: 8px 0; }
  .deg-row .label {
    font-size: 12px;
    color: var(--dim);
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .deg-row .bar {
    height: 7px;
    border-radius: 4px;
    background: #232c3a;
    overflow: hidden;
  }
  .deg-row .bar i {
    display: block;
    height: 100%;
    border-radius: 4px;
    background: var(--green);
    width: 0%;
  }
  .deg-row .sub {
    font-size: 11px;
    color: var(--faint);
    font-family: var(--mono);
    margin-top: 3px;
  }
  .legend {
    display: flex;
    gap: 16px;
    padding: 0 24px 12px;
    font-size: 12px;
    color: var(--dim);
  }
  .legend i {
    display: inline-block;
    width: 22px;
    height: 0;
    border-top: 3px solid var(--green);
    vertical-align: middle;
    margin-right: 6px;
    border-radius: 2px;
  }
  .legend i.active { border-color: var(--amber); }
  .legend i.todo { border-top-style: dashed; border-color: #3a4658; }
  .legend em { font-style: normal; }
  .spin {
    display: inline-block;
    width: 13px; height: 13px;
    border: 2px solid var(--line);
    border-top-color: var(--green);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: -2px;
    margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .spin { animation: none; }
  }
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; }
    #side { border-right: none; border-bottom: 1px solid var(--line); }
  }
</style>
</head>
<body>
<header>
  <h1>MotifQL <span class="q">·</span> follow the money</h1>
  <p>fuzzy money-flow motifs, written by Muse Spark</p>
  <span class="spacer"></span>
  <span class="badge" id="source-badge" hidden></span>
  <span class="badge" id="data-badge" hidden></span>
</header>
<main>
  <div id="side">
    <section>
      <h2>Describe the pattern</h2>
      <textarea id="english" spellcheck="false"
        placeholder="Money leaves an account and comes back to it…"></textarea>
      <div class="row">
        <button id="compile-btn" class="primary">Compile + show</button>
        <button id="scripted-btn" title="Deterministic rehearsal demo">Scripted demo</button>
      </div>
    </section>
    <section>
      <h2>Motif</h2>
      <div id="motif-box"><div class="empty-note">Compile something to see its MotifQL.</div></div>
    </section>
    <section id="witness-sec" hidden>
      <h2>Witness</h2>
      <div class="tabs" id="witness-tabs" role="tablist"></div>
    </section>
    <section id="degrees-sec" hidden>
      <h2>Why this score</h2>
      <div id="degrees"></div>
    </section>
  </div>
  <div id="stage-wrap">
    <div id="score-line" hidden>
      <span class="score" id="score-val">–</span>
      <span class="verdict quiet" id="verdict">–</span>
      <span class="meta" id="score-meta"></span>
    </div>
    <div id="caption"><span class="dim">Press Scripted demo — or describe a pattern and compile it.</span></div>
    <div id="stage"><svg id="graph" role="img" aria-label="Witness graph"></svg></div>
    <div class="legend">
      <span><i></i><em id="legend-done">traced hop</em></span>
      <span><i class="active"></i>playing now</span>
      <span><i class="todo"></i>not yet traced</span>
    </div>
    <div id="transport">
      <button id="btn-back" title="Previous hop" aria-label="Previous hop">
        <svg viewBox="0 0 16 16"><path d="M11 2 L4 8 L11 14 Z"/></svg>
      </button>
      <button id="btn-play" title="Play / pause" aria-label="Play or pause">
        <svg viewBox="0 0 16 16" id="icon-play"><path d="M3 1.5 L13.5 8 L3 14.5 Z"/></svg>
        <svg viewBox="0 0 16 16" id="icon-pause" hidden><path d="M3 2 h3.4 v12 H3 Z M9.6 2 H13 v12 H9.6 Z"/></svg>
      </button>
      <button id="btn-fwd" title="Next hop" aria-label="Next hop">
        <svg viewBox="0 0 16 16"><path d="M5 2 L12 8 L5 14 Z"/></svg>
      </button>
      <div id="progress" title="Scrub the trace"><div class="track" id="track"><div class="fill" id="fill"></div></div></div>
      <span id="clock">0.0s</span>
    </div>
  </div>
</main>
<script src="/app.js"></script>
</body>
</html>
